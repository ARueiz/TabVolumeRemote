<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabVolumeRemote</title>
  <link rel="stylesheet" href="popup.css">
  <script src="volume-sender.js" defer></script>
  <script src="popup.js" defer></script>
  <script src="connection.js" defer></script>
</head>
<body>
  <main>
    <h1>TabVolumeRemote</h1>
    <button id="open-settings" type="button">連線設定</button>
    <p id="connection-status" class="hint" role="status">正在取得連線狀態…</p>
    <p class="hint">YouTube、Twitch、Hami Video 主框架媒體音量控制</p>
    <label for="tabs">支援的網站分頁</label>
    <div class="tab-controls">
      <select id="tabs" disabled><option value="">請選取分頁</option></select>
      <button id="refresh" type="button">重新整理</button>
    </div>
    <p id="selected" class="selected">尚未選取分頁</p>
    <div class="volume-label">
      <label for="volume">音量</label>
      <output id="percentage" for="volume">—</output>
    </div>
    <input id="volume" type="range" min="0" max="100" step="1" value="50" disabled>
    <button id="mute" type="button" disabled>靜音</button>
    <p id="status" role="status" aria-live="polite">正在取得分頁…</p>
    <p class="hint">每約 100ms 傳送；放開滑桿會送出最終值。保留原本的靜音狀態。</p>
  </main>
</body>
</html>
